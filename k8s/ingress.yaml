# ============================================================
# k8s/ingress.yaml — Kubernetes Ingress (nginx)
#
# ARCHITECT'S NOTE:
#   The Ingress is the external entry point.
#   It terminates TLS (HTTPS) and routes:
#     yourdomain.com/api/*  → backend service (FastAPI)
#     yourdomain.com/*      → frontend service (nginx static)
#
#   TLS is managed by cert-manager (free Let's Encrypt certs).
#   Install cert-manager before applying this:
#     kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-gateway-ingress
  namespace: enterprise-ai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # TLS certificate via Let's Encrypt (cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Required for SSE streaming
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - yourdomain.com              # replace with your actual domain
      secretName: ai-gateway-tls
  rules:
    - host: yourdomain.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ai-gateway-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-gateway-frontend
                port:
                  number: 80
