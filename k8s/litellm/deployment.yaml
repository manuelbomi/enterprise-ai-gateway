# ============================================================
# k8s/litellm/deployment.yaml — LiteLLM Proxy on Kubernetes
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: enterprise-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/config/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: litellm-config
              mountPath: /config
              readOnly: true
          envFrom:
            - secretRef:
                name: ai-gateway-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config      # kubectl create configmap litellm-config --from-file=litellm/config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: enterprise-ai
spec:
  selector:
    app: litellm-proxy
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
