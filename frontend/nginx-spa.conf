# nginx config for React SPA — all routes serve index.html
# (React Router handles routing client-side)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Route all requests to index.html (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend (for production — nginx in reverse-proxy mode)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required for SSE streaming (disable buffering)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
